document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt-size:13px;font-weight:600;text-align:center;padding:10px 8px\">Total<\u002Fsc-raw-th>\n                <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:center;padding:10px 8px\">%<\u002Fsc-raw-th>\n                <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:center;padding:10px 8px\">Grade<\u002Fsc-raw-th>\n                <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:left;padding:10px 16px\">Remark<\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ sheetRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                  <sc-raw-tr>\n                    <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:8px 16px\">\n                      <div style=\"font-size:14px;font-weight:500;color:#212121\">{{ r.name }}<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8F918F\">{{ r.adm }}<\u002Fdiv>\n                    <\u002Fsc-raw-td>\n                    <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"3\">\n                      <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:8px 6px;text-align:center\">\n                        <sc-if value=\"{{ c.isInput }}\">\n                          <div style=\"display:flex;align-items:center;gap:3px;justify-content:center\">\n                            <input type=\"text\" value=\"{{ c.value }}\" sc-camel-on-change=\"{{ c.set }}\" aria-label=\"{{ c.label }}\" style=\"{{ c.style }}\">\n                            <div style=\"display:flex;flex-direction:column;gap:2px\">\n                              <button sc-camel-on-click=\"{{ c.abs }}\" title=\"Absent, not excused\" style=\"{{ c.absStyle }}\">A<\u002Fbutton>\n                              <button sc-camel-on-click=\"{{ c.exc }}\" title=\"Excused: could not have sat it\" style=\"{{ c.excStyle }}\">E<\u002Fbutton>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ c.isMarker }}\">\n                          <div style=\"display:flex;align-items:center;gap:4px;justify-content:center\">\n                            <span style=\"border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600;background:{{ c.markerBg }};color:{{ c.markerFg }}\">{{ c.markerLabel }}<\u002Fspan>\n                            <sc-if value=\"{{ c.canClear }}\"><button sc-camel-on-click=\"{{ c.clear }}\" title=\"Clear\" style=\"width:18px;height:18px;border-radius:5px;border:1px solid #e5e5e5;background:#fff;color:#8F918F;font-size:11px;cursor:pointer;padding:0\">×<\u002Fbutton><\u002Fsc-if>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ c.hasError }}\"><div style=\"font-size:10.5px;font-weight:500;color:#A81E1E;margin-top:3px\">{{ c.error }}<\u002Fdiv><\u002Fsc-if>\n                      <\u002Fsc-raw-td>\n                    <\u002Fsc-for>\n                    <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:8px;text-align:center;font-size:14px;font-weight:600;color:#212121\">{{ r.total }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:8px;text-align:center;font-size:14px;color:#212121\">{{ r.pct }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:8px;text-align:center;font-size:14px;font-weight:600;color:#212121\">{{ r.grade }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:8px 16px;font-size:13.5px;color:#555654\">{{ r.remark }}<sc-if value=\"{{ r.showObtainable }}\"><div style=\"font-size:11.5px;color:#8F918F\">{{ r.obtainableNote }}<\u002Fdiv><\u002Fsc-if><\u002Fsc-raw-td>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:12.5px;color:#8F918F\">A blank is not a zero: it means nothing has been entered, and a sheet with a blank cannot be submitted. Use <strong>A<\u002Fstrong> for an unexcused absence, which counts as zero and prints as ABS, and <strong>E<\u002Fstrong> where the student could not have sat it, which leaves the component out of what they could obtain.<\u002Fp>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showBroadsheet }}\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:14px\">\n          <div>\n            <div style=\"font-size:18px;font-weight:600;color:#212121\">{{ bs.title }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:#6F706F\">{{ bs.subtitle }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px\">\n            <button sc-camel-on-click=\"{{ bs.print }}\" style=\"height:36px;padding:0 14px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;color:#6F706F;font-size:13px;font-weight:500;cursor:pointer\">Print A3 landscape<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ bs.submit }}\" disabled=\"{{ bs.submitDisabled }}\" style=\"{{ bs.submitStyle }}\">{{ bs.submitLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ bs.showAttendanceWarning }}\">\n          <div style=\"border:1px solid #FAEEDA;background:#FAEEDA;border-radius:8px;padding:12px 16px;font-size:13.5px;color:#854F0B\">{{ bs.attendanceWarning }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ bs.showGapNote }}\">\n          <div style=\"border:1px solid #e5e5e5;background:#fff;border-radius:8px;padding:12px 16px;font-size:13.5px;color:#555654\">{{ bs.gapNote }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"border:1px solid #e5e5e5;background:#fff;border-radius:8px;overflow:hidden\">\n          <div style=\"overflow-x:auto\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:900px\">\n              <sc-raw-thead><sc-raw-tr>\n                <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:left;padding:10px 16px\">Student<\u002Fsc-raw-th>\n                <sc-for list=\"{{ bs.subjects }}\" as=\"s\" hint-placeholder-count=\"6\">\n                  <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:12.5px;font-weight:600;text-align:center;padding:10px 6px\">{{ s.short }}<sc-if value=\"{{ s.gap }}\"><div style=\"font-size:10.5px;font-weight:400;color:#A81E1E\">{{ s.gapNote }}<\u002Fdiv><\u002Fsc-if><\u002Fsc-raw-th>\n                <\u002Fsc-for>\n                <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:12.5px;font-weight:600;text-align:center;padding:10px 6px\">Average<\u002Fsc-raw-th>\n                <sc-if value=\"{{ ranks }}\"><sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:12.5px;font-weight:600;text-align:center;padding:10px 6px\">Position<\u002Fsc-raw-th><\u002Fsc-if>\n                <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:12.5px;font-weight:600;text-align:right;padding:10px 16px\">Compile<\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ bs.rows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                  <sc-raw-tr>\n                    <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:9px 16px\">\n                      <div style=\"font-size:14px;font-weight:500;color:#212121\">{{ r.name }}<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8F918F\">{{ r.adm }}<\u002Fdiv>\n                    <\u002Fsc-raw-td>\n                    <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"6\">\n                      <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:9px 6px;text-align:center;font-size:13.5px;color:{{ c.color }}\">{{ c.text }}<\u002Fsc-raw-td>\n                    <\u002Fsc-for>\n                    <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:9px 6px;text-align:center;font-size:13.5px;font-weight:600;color:#212121\">{{ r.avg }}<\u002Fsc-raw-td>\n                    <sc-if value=\"{{ ranks }}\"><sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:9px 6px;text-align:center;font-size:13.5px;color:#212121\">{{ r.pos }}<\u002Fsc-raw-td><\u002Fsc-if>\n                    <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:9px 16px;text-align:right;white-space:nowrap\">\n                      <span style=\"border-radius:8px;padding:2px 8px;font-size:12px;font-weight:500;background:{{ r.chipBg }};color:{{ r.chipFg }};margin-right:8px\">{{ r.chip }}<\u002Fspan>\n                      <button sc-camel-on-click=\"{{ r.compile }}\" style=\"height:28px;padding:0 10px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;color:#4A659D;font-size:12px;font-weight:500;cursor:pointer\">Open<\u002Fbutton>\n                    <\u002Fsc-raw-td>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showModeration }}\">\n        <div>\n          <div style=\"font-size:18px;font-weight:600;color:#212121\">Moderation · Head of Sciences<\u002Fdiv>\n          <div style=\"font-size:13px;color:#6F706F\">Senior Secondary science sheets, compared across the arms that offer them. Approve, or return with a note.<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ modRows }}\" as=\"m\" hint-placeholder-count=\"3\">\n          <div style=\"border:1px solid #e5e5e5;background:#fff;border-radius:8px;padding:16px 18px\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start\">\n              <div style=\"min-width:210px;flex:1\">\n                <div style=\"font-size:15px;font-weight:600;color:#212121\">{{ m.title }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#6F706F\">{{ m.meta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n                <div><div style=\"font-size:11.5px;color:#8F918F\">Class average<\u002Fdiv><div style=\"font-size:14px;font-weight:600;color:#212121\">{{ m.avg }}<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11.5px;color:#8F918F\">Highest · lowest<\u002Fdiv><div style=\"font-size:14px;font-weight:500;color:#212121\">{{ m.range }}<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11.5px;color:#8F918F\">Pass rate<\u002Fdiv><div style=\"font-size:14px;font-weight:500;color:#212121\">{{ m.pass }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"border-radius:8px;padding:2px 9px;font-size:13px;font-weight:500;background:{{ m.chipBg }};color:{{ m.chipFg }}\">{{ m.chip }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin-top:12px;border-top:1px solid #f2f2f2;padding-top:12px;display:flex;flex-wrap:wrap;gap:14px;align-items:center\">\n              <div style=\"font-size:12.5px;color:#6F706F\">{{ m.compare }}<\u002Fdiv>\n              <div style=\"margin-left:auto;display:flex;gap:8px\">\n                <button sc-camel-on-click=\"{{ m.view }}\" style=\"height:34px;padding:0 13px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;color:#6F706F;font-size:13px;font-weight:500;cursor:pointer\">View sheet<\u002Fbutton>\n                <sc-if value=\"{{ m.canDecide }}\">\n                  <button sc-camel-on-click=\"{{ m.return }}\" style=\"height:34px;padding:0 13px;border-radius:8px;border:1px solid #E33131;background:#fff;color:#E33131;font-size:13px;font-weight:500;cursor:pointer\">Return with a note<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ m.approve }}\" style=\"height:34px;padding:0 15px;border-radius:8px;border:0;background:#4A659D;color:#fff;font-size:13px;font-weight:500;cursor:pointer\">Approve<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showApproval }}\">\n        <div>\n          <div style=\"font-size:18px;font-weight:600;color:#212121\">Approvals &amp; publishing<\u002Fdiv>\n          <div style=\"font-size:13px;color:#6F706F\">Compiled classes waiting on the principal. Publishing locks the results; a change after that is an amendment.<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ approvalRows }}\" as=\"a\" hint-placeholder-count=\"2\">\n          <div style=\"border:1px solid #e5e5e5;background:#fff;border-radius:8px;padding:16px 18px\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start\">\n              <div style=\"min-width:210px;flex:1\">\n                <div style=\"font-size:15px;font-weight:600;color:#212121\">{{ a.title }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#6F706F\">{{ a.meta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"border-radius:8px;padding:2px 9px;font-size:13px;font-weight:500;background:{{ a.chipBg }};color:{{ a.chipFg }}\">{{ a.chip }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin-top:12px;border-top:1px solid #f2f2f2;padding-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n              <div style=\"font-size:12.5px;color:#6F706F\">{{ a.holdNote }}<\u002Fdiv>\n              <div style=\"margin-left:auto;display:flex;gap:8px;flex-wrap:wrap\">\n                <button sc-camel-on-click=\"{{ a.broadsheet }}\" style=\"height:34px;padding:0 13px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;color:#6F706F;font-size:13px;font-weight:500;cursor:pointer\">Open broadsheet<\u002Fbutton>\n                <sc-if value=\"{{ a.canDecide }}\">\n                  <button sc-camel-on-click=\"{{ a.return }}\" style=\"height:34px;padding:0 13px;border-radius:8px;border:1px solid #E33131;background:#fff;color:#E33131;font-size:13px;font-weight:500;cursor:pointer\">Return<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ a.comment }}\" style=\"height:34px;padding:0 13px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;color:#4A659D;font-size:13px;font-weight:500;cursor:pointer\">Principal's comments<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ a.publish }}\" style=\"height:34px;padding:0 15px;border-radius:8px;border:0;background:#4A659D;color:#fff;font-size:13px;font-weight:500;cursor:pointer\">Approve &amp; publish<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ a.published }}\">\n                  <button sc-camel-on-click=\"{{ a.amend }}\" style=\"height:34px;padding:0 13px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;color:#4A659D;font-size:13px;font-weight:500;cursor:pointer\">Raise an amendment<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ hasAmendments }}\">\n          <div style=\"border:1px solid #e5e5e5;background:#fff;border-radius:8px;overflow:hidden\">\n            <div style=\"padding:14px 18px 12px;font-size:15px;font-weight:600;color:#212121\">Amendments<\u002Fdiv>\n            <sc-for list=\"{{ amendmentRows }}\" as=\"m\" hint-placeholder-count=\"1\">\n              <div style=\"border-top:1px solid #f2f2f2;padding:13px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center\">\n                <div style=\"min-width:230px;flex:1\">\n                  <div style=\"font-size:14px;font-weight:500;color:#212121\">{{ m.title }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#6F706F\">{{ m.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"border-radius:8px;padding:2px 9px;font-size:13px;font-weight:500;background:{{ m.chipBg }};color:{{ m.chipFg }}\">{{ m.chip }}<\u002Fspan>\n                <sc-if value=\"{{ m.canDecide }}\"><button sc-camel-on-click=\"{{ m.approve }}\" style=\"height:32px;padding:0 14px;border-radius:8px;border:0;background:#4A659D;color:#fff;font-size:13px;font-weight:500;cursor:pointer\">Approve amendment<\u002Fbutton><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showHolds }}\">\n        <div>\n          <div style=\"font-size:18px;font-weight:600;color:#212121\">Fee holds<\u002Fdiv>\n          <div style=\"font-size:13px;color:#6F706F\">Students in classes being published this term. Balances are read from Finance as of 12 Dec 2025, 1:20 pm, as context for your decision. No result is ever held automatically.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #e5e5e5;background:#fff;border-radius:8px;overflow:hidden\">\n          <div style=\"overflow-x:auto\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:760px\">\n              <sc-raw-thead><sc-raw-tr>\n                <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:left;padding:10px 18px\">Student<\u002Fsc-raw-th>\n                <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:left;padding:10px 18px\">Class<\u002Fsc-raw-th>\n                <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:right;padding:10px 18px\">Balance (Finance)<\u002Fsc-raw-th>\n                <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:right;padding:10px 18px\">Oldest unpaid<\u002Fsc-raw-th>\n                <sc-raw-th style=\"backg he same subject across the arms<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#6F706F;margin-bottom:10px\">Where more than one arm offers it. A gap is a question for the head of department, not a judgement on a teacher.<\u002Fdiv>\n              <sc-for list=\"{{ an.compareRows }}\" as=\"c\" hint-placeholder-count=\"2\">\n                <div style=\"border-top:1px solid #f2f2f2;padding:11px 0\">\n                  <div style=\"font-size:14px;font-weight:500;color:#212121\">{{ c.subject }}<\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:18px;margin-top:6px\">\n                    <sc-for list=\"{{ c.arms }}\" as=\"a\" hint-placeholder-count=\"3\">\n                      <div><div style=\"font-size:11.5px;color:#8F918F\">{{ a.cls }}<\u002Fdiv><div style=\"font-size:15px;font-weight:600;color:#212121\">{{ a.avg }}<\u002Fdiv><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#6F706F;margin-top:6px\">{{ c.gap }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ an.noMovers }}\">\n            <div style=\"border:1px solid #e5e5e5;background:#fff;border-radius:8px;padding:16px 18px\">\n              <div style=\"font-size:15px;font-weight:600;color:#212121\">Term on term, by student<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#6F706F\">{{ an.noMoversNote }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ an.hasMovers }}\">\n            <div style=\"border:1px solid #e5e5e5;background:#fff;border-radius:8px;overflow:hidden\">\n              <div style=\"display:flex;align-items:center;gap:12px;padding:14px 18px 12px\">\n                <div><div style=\"font-size:15px;font-weight:600;color:#212121\">Term on term, by student<\u002Fdiv><div style=\"font-size:12.5px;color:#6F706F\">{{ an.moverNote }}<\u002Fdiv><\u002Fdiv>\n                <button sc-camel-on-click=\"{{ an.exportMovers }}\" style=\"margin-left:auto;height:32px;padding:0 13px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;color:#6F706F;font-size:12.5px;font-weight:500;cursor:pointer;flex:none\">Export CSV<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-raw-table style=\"width:100%;border-collapse:collapse\">\n                <sc-raw-thead><sc-raw-tr>\n                  <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:left;padding:10px 18px\">Student<\u002Fsc-raw-th>\n                  <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:left;padding:10px 18px\">Class<\u002Fsc-raw-th>\n                  <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:right;padding:10px 18px\">Previous term<\u002Fsc-raw-th>\n                  <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:right;padding:10px 18px\">This term<\u002Fsc-raw-th>\n                  <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:right;padding:10px 18px\">Change<\u002Fsc-raw-th>\n                <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ an.movers }}\" as=\"m\" hint-placeholder-count=\"2\">\n                    <sc-raw-tr>\n                      <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:11px 18px;font-size:14px;font-weight:500;color:#212121\">{{ m.name }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:11px 18px;font-size:13.5px;color:#555654\">{{ m.cls }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:11px 18px;text-align:right;font-size:14px;color:#555654\">{{ m.from }}<div style=\"font-size:11px;color:#8F  style=\"font-size:15px;font-weight:600;color:#212121\">Assessment structures<\u002Fdiv>\n        <sc-for list=\"{{ setup.structures }}\" as=\"st\" hint-placeholder-count=\"3\">\n          <div style=\"border:1px solid #e5e5e5;background:#fff;border-radius:8px;overflow:hidden\">\n            <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 18px\">\n              <div style=\"min-width:170px\">\n                <div style=\"font-size:15px;font-weight:600;color:#212121\">{{ st.name }}<\u002Fdiv>\n                <sc-if value=\"{{ st.locked }}\"><div style=\"font-size:12px;color:#6F706F\">{{ st.lockNote }}<\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n              <span style=\"font-size:13.5px;font-weight:600;color:{{ st.totalColor }}\">{{ st.totalLine }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ st.act }}\" style=\"margin-left:auto;height:32px;padding:0 13px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;color:#4A659D;font-size:12.5px;font-weight:500;cursor:pointer\">{{ st.actLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-raw-table style=\"width:100%;border-collapse:collapse\">\n              <sc-raw-thead><sc-raw-tr>\n                <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:left;padding:9px 18px\">Component<\u002Fsc-raw-th>\n                <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:right;padding:9px 18px\">Maximum<\u002Fsc-raw-th>\n                <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:left;padding:9px 18px\">Kind<\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ st.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <sc-raw-tr>\n                    <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:10px 18px;font-siz rap;gap:8px;padding:0 18px 16px\">\n              <sc-for list=\"{{ sc.rows }}\" as=\"b\" hint-placeholder-count=\"6\">\n                <div style=\"border:1px solid #e5e5e5;border-radius:8px;padding:8px 12px;min-width:138px\">\n                  <div style=\"display:flex;align-items:center;gap:8px\">\n                    <div style=\"font-size:15px;font-weight:600;color:#212121;flex:1\">{{ b.grade }}<\u002Fdiv>\n                    <sc-if value=\"{{ b.editable }}\">\n                      <div style=\"display:flex;gap:3px\">\n                        <button sc-camel-on-click=\"{{ b.down }}\" aria-label=\"Lower this band\" style=\"{{ b.stepStyle }}\">−<\u002Fbutton>\n                        <button sc-camel-on-click=\"{{ b.up }}\" aria-label=\"Raise this band\" style=\"{{ b.stepStyle }}\">+<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:{{ b.rangeColor }}\">{{ b.range }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#8F918F\">{{ b.remark }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <div style=\"border:1px solid #e5e5e5;background:#fff;border-radius:8px;padding:16px 18px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n            <div style=\"flex:1;min-width:200px\">\n              <div style=\"font-size:15px;font-weight:600;color:#212121\">Who takes what<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#6F706F\">The grid of students against the level's non-core subjects. This is a record the module proposes; nothing in the platform holds it today.<\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ setup.openWhoTakes }}\" style=\"height:34px;padding:0 14px;border-radius:8px;border:1px solid #4A659D;background:#fff;color:#4A659D;font-size:13px;font-weight:500;cursor:pointer\">Open the grid<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #e5e5e5;background:#fff;border-radius:8px;padding:16px 18px\">\n          <div style=\"font-size:15px;font-weight:600;color:#212121\">Report card options<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#6F706F;margin-bottom:10px\">What prints on every report card in this school.<\u002Fdiv>\n          <sc-for list=\"{{ setup.options }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #f2f2f2\">\n              <div style=\"flex:1\"><div style=\"font-size:14px;color:#212121\">{{ o.label }}<\u002Fdiv><div style=\"font-size:12px;color:#6F706F\">{{ o.note }}<\u002Fdiv><\u002Fdiv>\n              <button sc-camel-on-click=\"{{ o.toggle }}\" aria-label=\"{{ o.label }}\" style=\"{{ o.knobStyle }}\"><span style=\"{{ o.dotStyle }}\"><\u002Fspan><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #e5e5e5;background:#fff;border-radius:8px;overflow:hidden\">\n          <div style=\"display:flex;align-items:center;gap:12px;padding:14px 18px 12px\">\n            <div><div style=\"font-size:15px;font-weight:600;color:#212121\">Principal's remark templates<\u002Fdiv><div style=\"font-size:12.5px;color:#6F706F\">Offered by band of overall average when the principal writes a comment.<\u002Fdiv><\u002Fdiv>\n            <button sc-camel-on-click=\"{{ setup.editTemplates }}\" style=\"margin-left:auto;height:32px;padding:0 13px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;color:#4A659D;font-size:12.5px;font-weight:500;cursor:pointer;flex:none\">Edit<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-for list=\"{{ setup.templates }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:14px;border-top:1px solid #f2f2f2;padding:11px 18px\">\n              <div style=\"min-width:130px;font-size:13px;font-weight:500;color:#555654\">{{ t.band }}<\u002Fdiv>\n              <div style=\"flex:1;min-width:200px;font-size:13.5px;color:#212121\">{{ t.text }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showStudentRes }}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n          <span style=\"font-size:12px;color:#8F918F\">Class<\u002Fspan>\n          <div style=\"display:inline-flex;flex-wrap:wrap;border:1px solid #e5e5e5;background:#fff;border-radius:999px;padding:3px\">\n            <sc-for list=\"{{ sr.classTabs }}\" as=\"t\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:baseline\">\n          <span style=\"font-size:12px;color:#8F918F;flex:none\">Student<\u002Fspan>\n          <div style=\"display:flex;flex-wrap:wrap;gap:2px;max-height:72px;overflow-y:auto;border:1px solid #e5e5e5;background:#fff;border-radius:12px;padding:4px 6px;flex:1\">\n            <sc-for list=\"{{ sr.studentTabs }}\" as=\"t\" hint-placeholder-count=\"8\"><button sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #e5e5e5;background:#fff;border-radius:8px;overflow:hidden\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 18px\">\n            <div style=\"width:48px;height:48px;border-radius:999px;background:#EFF1F6;color:#4A659D;display:grid;place-content:center;font-size:16px;font-weight:600;flex:none\">{{ sr.initials }}<\u002Fdiv>\n            <div style=\"min-width:200px\">\n              <div style=\"font- ding:0 13px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;color:#4A659D;font-size:12.5px;font-weight:500;cursor:pointer\">Preview &amp; print<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ t.notPublished }}\">\n              <div style=\"border-top:1px solid #f2f2f2;padding:14px 18px;font-size:13.5px;color:#6F706F\">{{ t.calm }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ t.canPreview }}\">\n              <sc-raw-table style=\"width:100%;border-collapse:collapse\">\n                <sc-raw-thead><sc-raw-tr>\n                  <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:left;padding:9px 18px\">Subject<\u002Fsc-raw-th>\n                  <sc-if value=\"{{ t.showTotals }}\"><sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:center;padding:9px 12px\">Total<\u002Fsc-raw-th><\u002Fsc-if>\n                  <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:center;padding:9px 12px\">Grade<\u002Fsc-raw-th>\n                  <sc-if value=\"{{ t.showTotals }}\"><sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:left;padding:9px 18px\">Remark<\u002Fsc-raw-th><\u002Fsc-if>\n                <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ t.rows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                    <sc-raw-tr>\n                      <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:10px 18px;font-size:14px;color:#212121\">{{ r.name }}<\u002Fsc-raw-td>\n                      <sc-if value=\"{{ t.showTotals }}\"><sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:10px 12px;text-align:center;font-size:14px;color:#212121\">{{ r.total }}<\u002Fsc-raw-td><\u002Fsc-if>\n                      <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:10px 12px;text-align:center;font-size:14px;font-weight:600;color:#212121\">{{ r.grade }}<\u002Fsc-raw-td>\n                      <sc-if value=\"{{ t.showTotals }}\"><sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:10px 18px;font-size:13.5px;color:#555654\">{{ r.remark }}<\u002Fsc-raw-td><\u002Fsc-if>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <sc-if value=\"{{ sr.hasHistory }}\">\n          <div style=\"border:1px solid #e5e5e5;background:#fff;border-radius:8px;padding:16px 18px\">\n            <div style=\"font-size:15px;font-weight:600;color:#212121\">History<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#6F706F;margin-bottom:4px\">Amendments and holds on this student's results. Nothing here is deleted.<\u002Fdiv>\n            <sc-for list=\"{{ sr.history }}\" as=\"h\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;padding:9px 0;border-top:1px solid #f2f2f2\">\n                <span style=\"border-radius:8px;padding:2px 9px;font-size:12.5px;font-weight:500;background:{{ h.chipBg }};color:{{ h.chipFg }};flex:none\">{{ h.kind }}<\u002Fspan>\n                <div style=\"flex:1;min-width:200px\"><div style=\"font-size:13.5px;color:#212121\">{{ h.text }}<\u002Fdiv><div style=\"font-size:12px;color:#8F918F\">{{ h.meta }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showWhoTakes }}\">\n        <div>\n          <div style=\"font-size:18px;font-weight:600;color:#212121\">Who takes what · {{ wt.clsName }}<\u002Fdiv>\n          <div style=\"font-size:13px;color:#6F706F\">Core subjects are everyone's and are not on this grid. A student who does not take a subject is on no sheet, no average and no position for it.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #185FA5;background:#E6F1FB;border-radius:8px;padding:12px 16px;font-size:13px;color:#185FA5\">New record. Nothing in the platform holds which student takes a non-core subject today — subjects are offered per level, each core or not. Set once a term by the class teacher or the administrator; the FRD will decide which module owns it.<\u002Fdiv>\n        <div style=\"border:1px solid #e5e5e5;background:#fff;border-radius:8px;overflow:hidden\">\n          <div style=\"overflow-x:auto\">\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:520px\">\n              <sc-raw-thead><sc-raw-tr>\n                <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:left;padding:10px 18px\">Student<\u002Fsc-raw-th>\n                <sc-for list=\"{{ wt.subjects }}\" as=\"s\" hint-placeholder-count=\"2\">\n                  <sc-raw-th style=\"background:#F1F1F1;color:#555654;font-size:13px;font-weight:600;text-align:center;padding:10px 18px\">{{ s.name }}<div style=\"font-size:11px;font-weight:400;color:#8F918F\">{{ s.count }}<\u002Fdiv><\u002Fsc-raw-th>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ wt.rows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                  <sc-raw-tr>\n                    <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:9px 18px;font-size:14px;color:#212121\">{{ r.name }}<\u002Fsc-raw-td>\n                    <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"2\">\n                      <sc-raw-td style=\"border-bottom:1px solid #f2f2f2;padding:9px 18px;text-align:center\"><button sc-camel-on-click=\"{{ c.toggle }}\" aria-label=\"{{ c.label }}\" style=\"{{ c.style }}\">{{ c.mark }}<\u002Fbutton><\u002Fsc-raw-td>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showReport }}\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px\">\n          <div style=\"font-size:13px;color:#6F706F\">Preview as it will print: A4, black and white.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ card.print }}\" style=\"height:36px;padding:0 15px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;color:#6F706F;font-size:13px;font-weight:500;cursor:pointer\">Print this report card<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"overflow-x:auto;display:flex;justify-content:safe center\">\n          <div style=\"width:794px;flex:none;background:#fff;border:1px solid #e5e5e5;color:#000;padding:34px 38px\">\n            <div style=\"display:flex;align-items:center;gap:14px;border-bottom:2px solid #000;padding-bottom:14px\">\n              <img src=\"a2d9aeaf-304c-4e1f-bfc9-8165c01df1a4\" alt=\"\" style=\"height:52px;width:auto;filter:grayscale(1)\">\n              <div>\n                <div style=\"font-size:19px;font-weight:600;letter-spacing:.02em\">{{ card.school }}<\u002Fdiv>\n                <div style=\"font-size:12px\">{{ card.address }}<\u002Fdiv>\n                <div style=\"font-size:12px;font-weight:600;margin-top:2px\">{{ card.termLine }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 0;border-bottom:1px solid #000\">\n              <sc-for list=\"{{ card.facts }}\" as=\"f\" hint-placeholder-count=\"4\">\n                <div><div style=\"font-size:10.5px;text-transform:uppercase;letter-spacing:.04em\">{{ f.label }}<\u002Fdiv><div style=\"font-size:13px;font-weight:600\">{{ f.value }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;margin-top:12px\">\n              <sc-raw-thead><sc-raw-tr>\n                <sc-raw-th style=\"border:1px solid #000;padding:5px 6px;font-size:11px;text-align:left\">Subject<\u002Fsc-raw-th>\n                <sc-for list=\"{{ card.components }}\" as=\"c\" hint-placeholder-count=\"3\"><sc-raw-th style=\"border:1px solid #000;padding:5px 6px;font-size:11px;text-align:center\">{{ c.short }}<div style=\"font-weight:400\">{{ c.max }}<\u002Fdiv><\u002Fsc-raw-th><\u002Fsc-for>\n                <sc-raw-th style=\"border:1px solid #000;padding:5px 6px;font-size:11px;text-align:center\">Total<\u002Fsc-raw-th>\n                <sc-raw-th style=\"border:1px solid #000;padding:5px 6px;font-size:11px;text-align:center\">Grade<\u002Fsc-raw-th>\n                <sc-if value=\"{{ card.showStats }}\"><sc-raw-th style=\"border:1px solid #000;padding:5px 6px;font-size:11px;text-align:center\">Class avg<\u002Fsc-raw-th><\u002Fsc-if>\n                <sc-if value=\"{{ card.showStats }}\"><sc-raw-th style=\"border:1px solid #000;padding:5px 6px;font-size:11px;text-align:center\">High<\u002Fsc-raw-th><\u002Fsc-if>\n                <sc-if value=\"{{ card.showStats }}\"><sc-raw-th style=\"border:1px solid #000;padding:5px 6px;font-size:11px;text-align:center\">Low<\u002Fsc-raw-th><\u002Fsc-if>\n                <sc-raw-th style=\"border:1px solid #000;padding:5px 6px;font-size:11px;text-align:left\">Remark<\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ card.subjects }}\" as=\"s\" hint-placeholder-count=\"6\">\n                  <sc-raw-tr>\n                    <sc-raw-td style=\"border:1px solid #000;padding:4px 6px;font-size:11.5px\">{{ s.name }}<\u002Fsc-raw-td>\n                    <sc-for list=\"{{ s.cells }}\" as=\"c\" hint-placeholder-count=\"3\"><sc-raw-td style=\"border:1px solid #000;padding:4px 6px;font-size:11.5px;text-align:center\">{{ c }}<\u002Fsc-raw-td><\u002Fsc-for>\n                    <sc-raw-td style=\"border:1px solid #000;padding:4px 6px;font-size:11.5px;text-align:center;font-weight:600\">{{ s.total }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"border:1px solid #000;padding:4px 6px;font-size:11.5px;text-align:center;font-weight:600\">{{ s.grade }}<\u002Fsc-raw-td>\n                    <sc-if value=\"{{ card.showStats }}\"><sc-raw-td style=\"border:1px solid #000;padding:4px 6px;font-size:11.5px;text-align:center\">{{ s.avg }}<\u002Fsc-raw-td><\u002Fsc-if>\n                    <sc-if value=\"{{ card.showStats }}\"><sc-raw-td style=\"border:1px solid #000;padding:4px 6px;font-size:11.5px;text-align:center\">{{ s.high }}<\u002Fsc-raw-td><\u002Fsc-if>\n                    <sc-if value=\"{{ card.showStats }}\"><sc-raw-td style=\"border:1px solid #000;padding:4px 6px;font-size:11.5px;text-align:center\">{{ s.low }}<\u002Fsc-raw-td><\u002Fsc-if>\n                    <sc-raw-td style=\"border:1px solid #000;padding:4px 6px;font-size:11.5px\">{{ s.remark }}<\u002Fsc-raw-td>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border:1px solid #000;border-top:0;padding:8px 6px\">\n              <sc-for list=\"{{ card.totals }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <div><div style=\"font-size:10.5px;text-transform:uppercase;letter-spacing:.04em\">{{ t.label }}<\u002Fdiv><div style=\"font-size:13px;font-weight:600\">{{ t.value }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:18px;margin-top:14px;flex-wrap:wrap\">\n              <div style=\"flex:1;min-width:240px\">\n                <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:5px\">Attendance<\u002Fdiv>\n                <sc-raw-table style=\"width:100%;border-collapse:collapse\">\n                  <sc-for list=\"{{ card.attendance }}\" as=\"a\" hint-placeholder-count=\"3\">\n                    <sc-raw-tr><sc-raw-td style=\"border:1px solid #000;padding:4px 6px;font-size:11.5px\">{{ a.label }}<\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #000;padding:4px 6px;font-size:11.5px;text-align:center;width:64px\">{{ a.value }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-table>\n              <\u002Fdiv>\n              <sc-if value=\"{{ card.showRatings }}\">\n                <div style=\"flex:1;min-width:240px\">\n                  <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:5px\">Conduct and skills<\u002Fdiv>\n                  <sc-if value=\"{{ card.showRatingKey }}\"><div style=\"font-size:10.5px;margin-bottom:4px\">{{ card.ratingKeyLine }}<\u002Fdiv><\u002Fsc-if>\n                  <sc-raw-table style=\"width:100%;border-collapse:collapse\">\n                    <sc-for list=\"{{ card.ratings }}\" as=\"r\" hint-placeholder-count=\"6\">\n                      <sc-raw-tr><sc-raw-td style=\"border:1px solid #000;padding:4px 6px;font-size:11.5px\">{{ r.label }}<\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #000;padding:4px 6px;font-size:11.5px;text-align:center;width:64px\">{{ r.value }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-table>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px;border:1px solid #000;padding:8px 10px\">\n              <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:600\">Class teacher's comment<\u002Fdiv>\n              <p style=\"margin:3px 0 0;font-size:12px\">{{ card.teacherComment }}<\u002Fp>\n              <div style=\"font-size:10.5px;margin-top:3px\">{{ card.teacherName }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:8px;border:1px solid #000;padding:8px 10px\">\n              <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:600\">Principal's comment<\u002Fdiv>\n              <p style=\"margin:3px 0 0;font-size:12px\">{{ card.principalComment }}<\u002Fp>\n              <div style=\"font-size:10.5px;margin-top:3px\">{{ card.principalName }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;gap:14px;margin-top:12px;flex-wrap:wrap\">\n              <div style=\"font-size:11px\">{{ card.gradingKey }}<\u002Fdiv>\n              <sc-if value=\"{{ card.showNextTerm }}\"><div style=\"font-size:11.5px;font-weight:600\">{{ card.nextTerm }}<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<section style=\"padding:34px 20px 56px;background:#F1F1F1;border-top:1px solid #e5e5e5\">\n  <div style=\"max-width:1120px;margin:0 auto\">\n    <div style=\"font-size:16px;font-weight:600;color:#212121\">Phone · 390px<\u002Fdiv>\n    <p style=\"margin:4px 0 22px;font-size:13px;color:#6F706F;max-width:640px\">The score grid does not survive a phone, so on a phone it is one student at a time: the components as inputs, the computed total beneath them, and next and previous at the bottom. It reads and writes the same sheet as the grid above.<\u002Fp>\n    <div style=\"width:390px;max-width:100%;height:720px;border-radius:26px;border:1px solid #d8d8d8;background:#fff;overflow:hidden;display:flex;flex-direction:column\">\n      <div style=\"height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:11px;color:#8F918F;flex:none\"><span>1:20<\u002Fspan><span>▮▮▮<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #e5e5e5;flex:none\">\n        <span style=\"color:#6F706F;font-size:18px\">‹<\u002Fspan>\n        <div style=\"min-width:0\"><div style=\"font-size:14px;font-weight:600;color:#212121\">{{ ph.title }}<\u002Fdiv><div style=\"font-size:11.5px;color:#8F918F\">{{ ph.sub }}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;overflow-y:auto;padding:16px 14px\">\n        <div style=\"font-size:12px;color:#8F918F\">{{ ph.counter }}<\u002Fdiv>\n        <div style=\"font-size:19px;font-weight:600;color:#212121;margin-top:2px\">{{ ph.name }}<\u002Fdiv>\n        <div style=\"font-size:12px;color:#8F918F\">{{ ph.adm }}<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:18px\">\n          <sc-for list=\"{{ ph.cells }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div>\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between\"><label style=\"font-size:13.5px;color:#212121\">{{ c.label }}<\u002Flabel><span style=\"font-size:11.5px;color:#8F918F\">max {{ c.max }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:8px;margin-top:5px\">\n                <input type=\"text\" value=\"{{ c.value }}\" sc-camel-on-change=\"{{ c.set }}\" aria-label=\"{{ c.label }}\" style=\"{{ c.style }}\">\n                <button sc-camel-on-click=\"{{ c.abs }}\" style=\"{{ c.absStyle }}\">ABS<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ c.exc }}\" style=\"{{ c.excStyle }}\">Excused<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{ c.hasError }}\"><div style=\"font-size:11.5px;font-weight:500;color:#A81E1E;margin-top:4px\">{{ c.error }}<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:22px;margin-top:20px;border-top:1px solid #f2f2f2;padding-top:14px\">\n          <div><div style=\"font-size:11.5px;color:#8F918F\">Total<\u002Fdiv><div style=\"font-size:17px;font-weight:600;color:#212121\">{{ ph.total }}<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:11.5px;color:#8F918F\">Percentage<\u002Fdiv><div style=\"font-size:17px;font-weight:600;color:#212121\">{{ ph.pct }}<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:11.5px;color:#8F918F\">Grade<\u002Fdiv><div style=\"font-size:17px;font-weight:600;color:#212121\">{{ ph.grade }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ ph.showObtainable }}\"><div style=\"font-size:12px;color:#6F706F;margin-top:8px\">{{ ph.obtainable }}<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"flex:none;border-top:1px solid #e5e5e5;padding:11px 14px;display:flex;gap:10px\">\n        <button sc-camel-on-click=\"{{ ph.prev }}\" style=\"flex:1;height:46px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;color:#555654;font-size:15px;font-weight:500;cursor:pointer\">Previous<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ ph.next }}\" style=\"flex:1;height:46px;border-radius:8px;border:0;background:#4A659D;color:#fff;font-size:15px;font-weight:500;cursor:pointer\">Next<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ drawer.open }}\">\n  <div style=\"position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;background:rgba(0,0,0,.5)\">\n    <div sc-camel-on-click=\"{{ closeDrawer }}\" style=\"flex:1\"><\u002Fdiv>\n    <div style=\"width:460px;max-width:94vw;background:#fff;height:100%;display:flex;flex-direction:column;animation:xvs-in .18s ease-out\">\n      <div style=\"padding:18px 20px;border-bottom:1px solid #e5e5e5\">\n        <div style=\"font-size:16px;font-weight:600;color:#212121\">{{ drawer.title }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#6F706F\">{{ drawer.subtitle }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;overflow-y:aut  = (this.pastTerms[adm] || []).map((t) => ({\n      term: t.term, published: true, calm: \"\", avg: t.avg, pos: this.ranks() ? t.pos : \"—\", released: \"Released \" + t.released,\n      showTotals: false,\n      rows: t.subjects.map((p) => ({ name: p[0], grade: p[1] })),\n    }));\n\n    const history = [];\n    s.amendments.filter((a) => a.adm === adm).forEach((a) => {\n      history.push({ kind: \"Amendment\", text: a.label + \" — \" + a.reason, meta: \"Raised by \" + a.by + \" · \" + (a.status === \"approved\" ? \"approved by Mr. Olumide Bankole\" : \"waiting for the principal\"),\n        chipBg: this.chip[a.status === \"approved\" ? \"green\" : \"yellow\"][0], chipFg: this.chip[a.status === \"approved\" ? \"green\" : \"yellow\"][1] });\n    });\n    if (s.holds[adm]) {\n      const h = s.holds[adm];\n      history.push({ kind: \"Hold placed\", text: h.reason, meta: \"By \" + h.by + \" · \" + h.at + \" · still held\",\n        chipBg: this.chip.amber[0], chipFg: this.chip.amber[1] });\n    } else if (adm === \"BFS/2024/0031\") {\n      history.push({ kind: \"Hold lifted\", text: \"Two terms unpaid; family asked to see the bursar\", meta: \"Placed by Mrs. Funke Adeyemi, Wed 10 Dec 2025 · lifted today\",\n        chipBg: this.chip.gray[0], chipFg: this.chip.gray[1] });\n    }\n\n    const tabNames = [\"Profile\", \"Guardians\", \"Attendance\", \"Results\", \"Fees\", \"Documents\"];\n    const pickStyle = (on) => \"border:0;border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:500;cursor:pointer;\" + (on ? \"background:#DBE0EB;color:#4A659D\" : \"background:transparent;color:#6F706F\");\n    return { sr: {\n      classTabs: this.visibleClasses().map((c) => ({\n        label: this.classes[c].name, style: pickStyle(c === clsId),\n        go: () => this.setState({ clsId: c, subId: null }),\n      })),\n      studentTabs: roster.map((x) => ({\n        label: x.name, style: pickStyle(x.adm === adm),\n        go: () => this.setState({ subId: x.adm }),\n      })),\n      name: st.name, adm, cls: this.classes[clsId].name, initials: (st.name.split(/\\s+/).map((p) => p[0]).slice(0, 2).join(\"\")).toUpperCase(),\n      branch: this.isSunrise() ? \"Sunrise Academy\" : this.classes[clsId].branch,\n      guardian: this.guardian(adm).name + (this.guardian(adm).email ? \" · \" + this.guardian(adm).email : \" · no email on file\"),\n      tabs: tabNames.map((t) => ({\n        label: t,\n        style: \"border:0;border-bottom:2px solid \" + (t === \"Results\" ? \"#4A659D\" : \"transparent\") + \";background:transparent;padding:9px 13px;font-size:13.5px;font-weight:500;cursor:pointer;color:\" + (t === \"Results\" ? \"#4A659D\" : \"#6F706F\"),\n        go: t === \"Results\" ? () => {} : () => this.toast(t + \" tab\", \"Student Management owns this tab. Only Results is in this module.\", \"info\"),\n      })),\n      terms: [current].concat(past).map((t) => ({\n        ...t,\n        notPublished: !t.published,\n        canPreview: t.published,\n        preview: () => this.go(\"report\", { clsId, subId: adm }),\n      })),\n      history, hasHistory: history.length > 0,\n      ranks: this.ranks(),\n    } };\n  }\n\n  cardVals() {\n    const s = this.state;\n    if (s.screen !== \"report\") return { card: { facts: [], subjects: [], totals: [], attendance: [], ratings: [], components: [] } };\n    const clsId = s.clsId || \"jss1b\";\n    const adm = s.subId || this.roster(clsId)[0].adm;\n    const st = this.roster(clsId).find((x) => x.adm === adm) || this.roster(clsId)[0];\n    const comps = this.components(clsId);\n    const subs = this.subjectsFor(clsId).filter((x) => this.takesSubject(clsId, x, st.adm));\n    const pos = this.positions(clsId);\n    let obtained = 0, obtainable = 0;\n    const rows = subs.map((x) => {\n      const r = this.compute(clsId, x.id, st.adm);\n      obtained += r.total; obtainable += r.obtainable;\n      const all = this.roster(clsId).filter((y) => this.takesSubject(clsId, x, y.adm)).map((y) => this.compute(clsId, x.id, y.adm)).filter((y) => !y.blank);\n      return {\n        name: x.name,\n        cells: comps.map((c) => { const v = this.cellValue(clsId, x.id, st.adm, c); return v === \"EXC\" ? \"Exc\" : v === \"ABS\" ? \"ABS\" : String(v); }),\n        total: r.blank ? \"—\" : String(r.total), grade: r.grade,\n        avg: all.length ? (all.reduce((a, b) => a + b.total, 0) / all.length).toFixed(1) : \"—\",\n        high: all.length ? String(Math.max.apply(null, all.map((y) => y.total))) : \"—\",\n        low: all.length ? String(Math.min.apply(null, all.map((y) => y.total))) : \"—\",\n        remark: r.remark,\n      };\n    });\n    const avg = this.studentAvg(clsId, st.adm);\n    const scale = this.scaleFor(clsId);\n    const totals = [\n      { label: \"Total obtained\", value: String(obtained) },\n      { label: \"Total obtainable\", value: String(obtainable) },\n      { label: \"Overall average\", value: avg === null ? \"—\" : avg.toFixed(2) + \"%\" },\n    ];\n    if (this.ranks()) totals.push({ label: \"Position in class\", value: pos[st.adm] ? this.ordinal(pos[st.adm]) + \" of \" + this.roster(clsId).length : \"—\" });\n    return { card: {\n      school: this.isSunrise() ? \"Sunrise Academy\" : \"Brightfield Schools\",\n      address: this.isSunrise() ? \"Ibadan, Oyo State · 0803 111 2222\" : this.classes[clsId].branch + \", Lagos · 0801 234 5678\",\n      termLine: \"Report card · First Term, 2025/2026\",\n      facts: [\n        { label: \"Student\", value: st.name },\n        { label: \"Admission no.\", value: st.adm },\n        { label: \"Class\", value: this.classes[clsId].name },\n        { label: \"Number in class\", value: String(this.roster(clsId).length) },\n      ],\n      components: comps.map((c) => ({ short: c.short, max: c.max })),\n      showStats: !!s.cardOptions.classStats,\n      showRatingKey: !!s.cardOptions.ratingKey && this.usesRatings(),\n      ratingKeyLine: \"1 poor · 2 fair · 3 good · 4 very good · 5 excellent\",\n      subjects: rows, totals,\n      attendance: [\n        { label: \"Times school opened\", value: \"58\" },\n        { label: \"Times present\", value: \"54\" },\n        { label: \"Times absent\", value: \"4\" },\n      ],\n      showRatings: this.usesRatings(),\n      ratings: this.ratingKeys.map((k) => ({ label: k, value: String((s.ratings[st.adm] || {})[k] || 4) })),\n      teacherComment: s.comments[st.adm] || \"A steady term with real effort in every subject. Keep it up next term.\",\n      teacherName: this.classes[clsId].teacher + \", class teacher\",\n      principalComment: \"An excellent result. Keep it up.\",\n      principalName: \"Mr. Olumide Bankole, Principal\",\n      gradingKey: scale.map((b) => b[1] + \" \" + b[0] + \"+\").join(\"  ·  \"),\n      showNextTerm: true,\n      nextTerm: \"Next term begins Mon 5 Jan 2026\",\n      print: () => this.toast(\"Sent to the printer\", \"A4, black and white.\"),\n    } };\n  }\n\n  phoneVals() {\n    const s = this.state;\n    const clsId = this.isSunrise() ? \"spry5\" : \"jss1a\";\n    const subId = \"mth\";\n    const sub = this.subjectsFor(clsId).find((x) => x.id === subId);\n    const roster = this.roster(clsId);\n    const idx = Math.min(s.phoneIdx, roster.length - 1);\n    const st = roster[idx];\n    const comps = this.components(clsId);\n    const r = this.compute(clsId, subId, st.adm);\n    return { ph: {\n      title: sub.name + \" · \" + this.classes[clsId].name,\n      sub: \"First Term, 2025/2026\",\n      counter: \"Student \" + (idx + 1) + \" of \" + roster.length,\n      name: st.name, adm: st.adm,\n      cells: comps.map((c) => {\n        const key = clsId + \"/\" + subId + \"/\" + st.adm + \"/\" + c.key;\n        const v = this.cellValue(clsId, subId, st.adm, c);\n        const err = s.errors[key];\n        const marker = v === \"ABS\" || v === \"EXC\";\n        return {\n          label: c.name, max: c.max,\n          value: marker ? \"\" : String(v === null || v === undefined ? \"\" : v),\n          style: \"flex:1;height:46px;border-radius:8px;text-align:center;font-family:inherit;font-size:16px;color:#212121;background:#fff;border:1px solid \" + (err ? \"#E33131\" : \"#e5e5e5\"),\n          set: (e) => this.setScore(clsId, subId, st.adm, c, e.target.value),\n          abs: () => this.setMarker(clsId, subId, st.adm, c, \"ABS\"),\n          exc: () => this.setMarker(clsId, subId, st.adm, c, \"EXC\"),\n          absStyle: \"height:46px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid \" + (v === \"ABS\" ? \"#E33131;background:#FCE9E9;color:#A81E1E\" : \"#e5e5e5;background:#fff;color:#8F918F\"),\n          excStyle: \"height:46px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid \" + (v === \"EXC\" ? \"#4A659D;background:#DBE0EB;color:#4A659D\" : \"#e5e5e5;background:#fff;color:#8F918F\"),\n          hasError: !!err, error: err || \"\",\n        };\n      }),\n      total: r.blank ? \"—\" : String(r.total),\n      pct: r.blank ? \"—\" : r.pct.toFixed(2) + \"%\",\n      grade: r.blank ? \"—\" : r.grade,\n      showObtainable: !r.blank && r.excused,\n      obtainable: r.total + \" out of \" + r.obtainable + \" obtainable, graded at \" + Math.round(r.pct) + \"%. The excused component is left out of what this student could obtain.\",\n      prev: () => this.setState({ phoneIdx: Math.max(0, idx - 1) }),\n      next: () => this.setState({ phoneIdx: Math.min(roster.length - 1, idx + 1) }),\n    } };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
