# Render Blueprint (B7) - web + Celery worker + Key Value (Redis).
#
# Two ways to use this:
#   a) Blueprint adoption: Render Dashboard → New → Blueprint → point at this
#      repo. Render creates/links the services below.
#   b) Manual (if you keep the existing hand-created web service): create only
#      the "xvs-worker" Background Worker and "xvs-redis" Key Value instance in
#      the dashboard with the same commands/values shown here.
#
# Both services below now set CELERY_EAGER=false and take REDIS_URL from the
# Key Value instance, so a blueprint apply brings up a working scheduler.
#
# IF YOUR WEB SERVICE WAS CREATED BY HAND rather than from this blueprint, this
# file changes nothing on its own: set CELERY_EAGER=false and REDIS_URL in the
# Render dashboard for it, and create the worker below. Do the worker and the
# Key Value instance FIRST - flipping the web service to non-eager while there
# is no broker to reach turns every .delay() into a connection error, where
# today it merely runs inline.
#
# Why this matters: eager mode has no beat scheduler, so while it is on, NO
# periodic task runs at all - not late, never. That includes overdue-fee
# dunning, the undispatched-payout recovery sweep, and the unbooked-gateway-
# money alarms. core.checks (core.W001) reports the condition on every
# management command in a DEBUG=False deployment.

services:
  - type: web
    name: xvs-backend
    runtime: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "cd apps && gunicorn apps.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: apps.settings.staging
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CELERY_EAGER
        value: "false"  # requires the worker + Key Value instance below
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: xvs-redis
          property: connectionString
      # SECRET_KEY, DB_*, EMAIL_*, ALLOWED_HOSTS and CORS_ALLOWED_ORIGINS
      # come from the dashboard env group.
      #
      # The addresses below have no fallback: apps/settings/staging.py refuses
      # to start without them, so that a deployment missing one cannot mail
      # activation links that open another deployment's product. Set each to
      # the address THIS service serves.
      - key: FRONTEND_BASE_URL      # the Console, where staff sign in
        sync: false
      - key: SCHOOL_APP_BASE_URL    # the school apps, scheme and host only
        sync: false
      - key: API_PUBLIC_BASE_URL    # where this API answers from
        sync: false
      - key: HEALTH_PROBE_BASE_URL  # where the synthetic probes knock
        sync: false
      - key: HEALTH_SSL_DOMAIN      # bare hostname whose certificate is watched
        sync: false

  - type: worker
    name: xvs-worker
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    # -B embeds the beat scheduler in the worker (single-service shape).
    # If you ever scale to multiple workers, move beat to its own service -
    # two embedded beats would double-fire every periodic task.
    startCommand: "cd apps && celery -A apps worker -B --loglevel=info --concurrency=2"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: apps.settings.staging
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CELERY_EAGER
        value: "false"  # the worker itself always runs real tasks
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: xvs-redis
          property: connectionString
      # Share the same dashboard env group as the web service - the worker
      # needs the DB and email credentials too.
      #
      # The worker is what renders and sends the mail, so the addresses the
      # links are built on have to be right HERE as well as on the web
      # service. Same values, same refusal to start without them.
      - key: FRONTEND_BASE_URL
        sync: false
      - key: SCHOOL_APP_BASE_URL
        sync: false
      - key: API_PUBLIC_BASE_URL
        sync: false
      - key: HEALTH_PROBE_BASE_URL
        sync: false
      - key: HEALTH_SSL_DOMAIN
        sync: false

  - type: keyvalue
    name: xvs-redis
    plan: free          # 25 MB - plenty for a task broker at this volume
    ipAllowList: []     # internal-only access
