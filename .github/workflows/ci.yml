name: CI

# main only. Staging is not a branch anybody commits to: it is reset to main and
# force-pushed by the deploy script, so a staging run tests a tree main has
# already tested, twice as slowly and for the same answer.
#
# The one case this gives up is a commit pushed straight to staging without
# going through main. That is not how this repo deploys, and a direct push to
# staging is a mistake CI ought not to be the thing that catches.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: apps.settings.ci
      # A dummy value - base.py refuses to start without it. CI never talks to
      # Zoho, and the email backend is in-memory.
      SECRET_KEY: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: apps
        run: python manage.py check

      - name: Migration drift check
        working-directory: apps
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations (fresh-install replay on PostgreSQL)
        working-directory: apps
        run: python manage.py migrate

      - name: API schema generates cleanly
        working-directory: apps
        run: python manage.py spectacular --file /dev/null

      # The full suite, one worker per core: about 8 minutes where one process
      # takes about 30. tblib (requirements.txt) is what lets a failing test in
      # a worker be reported by name. Timings (--slowest) need a single
      # process, so find slow tests locally.
      - name: Run test suite
        working-directory: apps
        run: python manage.py test --noinput --parallel auto

  # The whole development seed chain, run exactly as a developer runs it, against
  # an empty server. Nothing in the test suite runs reseed-dev.sh end to end, so
  # a model, a required field or a renamed command that one seeder still uses
  # otherwise breaks the reseed silently, and is found by the next developer to
  # rebuild their database. Local settings, as a developer's machine has them;
  # the connection comes from DB_*, and recreate_dev_db makes the database.
  reseed:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-not-a-real-secret
      PYTHON: python
      DB_NAME: cx_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reseed the development database from empty
        run: ./reseed-dev.sh
